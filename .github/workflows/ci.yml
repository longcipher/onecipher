name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: RUSTC_WRAPPER= cargo +nightly clippy --all --all-targets -- -D warnings

  sort:
    name: Cargo Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-sort
      - run: cargo sort -w -g -c

  shear:
    name: Unused Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-shear
      - run: cargo shear

  hard-gates:
    name: Hard Gates (R12 / R56)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # R56: the isolated crates must stay free of every async runtime and
      # network stack, not just tokio. The previous version only grepped for
      # `tokio`, so adding e.g. `reqwest` or `async-std` would have passed.
      - name: R56 — no async/network deps in isolated crates
        run: |
          forbidden='tokio|reqwest|tungstenite|hyper|async-std|smol'
          status=0
          for crate in oc-crypto oc-policy oc-keyagent oc-session-key; do
            # `--edges normal` still catches dev-deps? No -- so check both:
            # normal edges gate the shipped tree, all edges gate dev-deps too,
            # which R56 also forbids.
            if hit=$(cargo tree -p "$crate" 2>/dev/null | grep -Eo "^[^a-zA-Z]*($forbidden) v[0-9]" | sort -u); then
              if [ -n "$hit" ]; then
                echo "R56 VIOLATION in $crate:"
                echo "$hit"
                status=1
              fi
            fi
          done
          exit $status

      # R12a: source-level isolation. Mirrors `just r12-check`.
      - name: R12a — no TCP types in isolated crate sources
        run: |
          if grep -rnE 'TcpListener|TcpStream' \
               crates/oc-keyagent/src/ crates/oc-crypto/src/ \
               crates/oc-policy/src/ crates/oc-session-key/src/; then
            echo "R12a VIOLATION: TCP types found in isolated crate sources"
            exit 1
          fi
          echo "R12a PASS"

  duplicate-deps:
    name: Duplicate Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-duplicate-deps.sh

  no-std:
    name: no-std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # A13 pilot (oc-signer only): host must pass; thumbv7m is
        # experimental until each dependency's `std` gate is audited.
        target: [host, thumbv7m-none-eabi]
    continue-on-error: ${{ matrix.target == 'thumbv7m-none-eabi' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'thumbv7m-none-eabi' && 'thumbv7m-none-eabi' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: host no_std check
        if: matrix.target == 'host'
        run: cargo check -p oc-signer --no-default-features
      - name: thumbv7m no_std check (experimental)
        if: matrix.target == 'thumbv7m-none-eabi'
        run: cargo check -p oc-signer --no-default-features --target thumbv7m-none-eabi

  skill-consistency:
    name: SKILL <-> clap consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-skill-consistency.sh

  makefile-mirror:
    name: Justfile <-> Makefile mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-makefile-mirror.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny
      - run: cargo deny check advisories licenses bans sources

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm run test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      # OCWP conformance vectors must hold on BOTH ends (design §9.4). The TS
      # half re-runs under `npm run test`, so the daemon half is what this adds.
      - name: OCWP conformance (Rust half)
        run: cargo test -p oc-cli --bin onecipher vectors
      # Playwright consent e2e: real Chromium, disposable profile, stub daemon.
      # `channel: chromium` needs a browser fetched explicitly.
      - name: Install Chromium for the consent e2e
        run: npx playwright install --with-deps chromium
        working-directory: extension
      - name: Consent e2e
        run: npm run test:e2e
        working-directory: extension
      # The e2e evidence file is the auditable record (design §9.5); upload it
      # so a failed run can be inspected instead of guessed at.
      - name: Upload consent e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-evidence
          path: extension/e2e/verification/e2e.json
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin onecipher

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit
