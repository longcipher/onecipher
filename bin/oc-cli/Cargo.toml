[package]
name = "oc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "CLI for OneCipher"
readme = "README.md"

[[bin]]
name = "onecipher"
path = "src/main.rs"

[features]
# `git` is OFF by default: `git2` pulls in `libgit2-sys` → `libssh2-sys` →
# OpenSSL. Linking OpenSSL into a signing wallet that already links BoringSSL
# (via `hpx`'s `boring-tls`) doubles the C-crypto attack surface and inflates
# both binary size and cold-build time, for a feature most users never touch.
# Build with `--features git` to enable the `onecipher git` subcommand.
#
# `webui` is ON by default but can be switched off: `webauthn-rs` is the sole
# source of OpenSSL in the dependency graph, and the binary already links
# BoringSSL through `hpx`'s `boring-tls`. `--no-default-features --features
# tui,walletconnect` yields a signing-focused binary with a single C-crypto
# stack.
#
# `xrpl` is OFF by default — see the rationale in `oc-signer/Cargo.toml`.
default = ["webui"]
git = ["oc-secret/git"]
webui = ["dep:oc-webui"]
xrpl = ["oc-signer/xrpl"]

[dependencies]
arboard = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
crossterm = { workspace = true }
dirs = "6"
ed25519-dalek = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
hpx = { workspace = true }
jiff = { workspace = true }
k256 = { workspace = true }
oc-core = { workspace = true, features = ["hardened"] }
oc-keyagent = { workspace = true }
oc-netagent = { workspace = true }
oc-pay = { workspace = true, features = ["http"] }
oc-secret = { workspace = true }
oc-signer = { workspace = true }
oc-vault = { workspace = true }
oc-wallet = { workspace = true, features = ["rpc", "sui-grpc"] }
oc-walletconnect = { workspace = true }
oc-webui = { workspace = true, optional = true }
prost = { workspace = true }
qr2term = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true }
regex-lite = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.8"
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
oc-signer = { workspace = true, features = ["fast-kdf"] }
proptest = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
