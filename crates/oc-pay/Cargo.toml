[package]
name = "oc-pay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "OneCipher payment primitives — PaymentSettler trait + EVM/Solana/Tempo settlers (x402 + MPP)"

[lib]
name = "oc_pay"
path = "src/lib.rs"

[features]
http = ["dep:hpx", "dep:base64", "dep:getrandom", "dep:oc-core"]
# Phase-1 stubs for MPP (multi-party payment) channels and Tempo channel
# settlement. Unimplemented upstream (T19); kept behind this gate so the
# default build stays lean. Do NOT enable until the real Tempo wire protocol
# lands.
experimental = []

[dependencies]
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true }
hpx = { workspace = true, optional = true }
oc-core = { workspace = true, optional = true }
oc-session-key = { workspace = true }
rust_decimal = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
