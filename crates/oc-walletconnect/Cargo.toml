[package]
name = "oc-walletconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WalletConnect v2 protocol wrapper (wallet + dApp roles) — BSL-1.1 licensed"

[features]
default = []
test-utils = []

[dependencies]
backon = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
hpx-yawc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
url = "2.5"
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex-literal = "0.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
