[package]
name = "oc-walletconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WalletConnect v2 protocol wrapper (wallet + dApp roles) — BSL-1.1 licensed"

[features]
default = []
test-utils = []

[dependencies]
backon = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
hpx-yawc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
tracing = { workspace = true }
url = { workspace = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex-literal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

# These integration targets drive `mock_relay` / `attach_mock_relay` /
# `process_one`, which only exist with `test-utils` (the lib itself is built
# without `cfg(test)` for integration targets). `required-features` keeps
# bare `cargo test -p oc-walletconnect` green by skipping them, while
# `--features test-utils` / `--all-features` (the documented test
# invocation) still runs everything.
[[test]]
name = "dapp_client"
path = "tests/dapp_client.rs"
required-features = ["test-utils"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["test-utils"]

[[test]]
name = "mock_relay"
path = "tests/mock_relay.rs"
required-features = ["test-utils"]

[[test]]
name = "pairing_flow"
path = "tests/pairing_flow.rs"
required-features = ["test-utils"]

[[test]]
name = "session_level_methods"
path = "tests/session_level_methods.rs"
required-features = ["test-utils"]

[[test]]
name = "wallet_server"
path = "tests/wallet_server.rs"
required-features = ["test-utils"]

[lints]
workspace = true
