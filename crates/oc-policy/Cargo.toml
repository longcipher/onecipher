[package]
name = "oc-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Policy Engine v2 for OneCipher"

[dependencies]
# RFC3339 parsing for policy expiry. `jiff` is already in this crate's tree via
# `oc-core` and pulls only `jiff-core` + `serde_core`, so declaring it directly
# adds zero packages while removing a hand-rolled parser that accepted invalid
# calendar dates. R56-clean: no tokio/reqwest/hyper in its subtree.
jiff = { workspace = true }
oc-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wasmi = { workspace = true }
wat = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "policy_eval"
harness = false

[lints]
workspace = true
