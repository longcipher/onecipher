[package]
name = "oc-netagent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Network-Agent: WalletConnect v2 wallet-role server for OneCipher — relays to Key-Agent over UDS"

[lib]
name = "oc_netagent"
path = "src/lib.rs"

[features]
# `real-rpc`: session-key real RPC bridge (`session_key_rpc` module).
# Wires `oc-session-key` provider traits to live JSON-RPC endpoints.
# `alloy` / `solana-client` typed SDKs (when adopted) land here in
# `oc-netagent`, never in the R56 leaf. Off by default so the default build
# stays mock-only.
real-rpc = ["dep:oc-session-key", "dep:base64"]

[dependencies]
# `alloy-dyn-abi` backs the `sim` ABI decoder. It replaces a hand-rolled
# fixed-slot decoder that could only read static types and rendered dynamic
# types (`address[]`, `bytes`, tuples) as their raw offset-pointer word — a
# misleading value to show in a signing-approval prompt.
alloy-dyn-abi = { workspace = true }
axum = { workspace = true, features = ["ws"] }
backon = { workspace = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true }
hpx = { workspace = true, features = ["rustls-tls", "http1", "http2", "json"] }
oc-core = { workspace = true }
oc-keyagent = { workspace = true }
oc-policy = { workspace = true }
oc-session-key = { workspace = true, optional = true }
oc-signer = { workspace = true }
oc-siwx = { workspace = true }
oc-walletconnect = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
futures = { workspace = true }
oc-walletconnect = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
