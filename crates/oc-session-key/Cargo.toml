[package]
name = "oc-session-key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Multi-chain SessionKeyProvider trait + EVM/Solana impls for OneCipher"

[dependencies]
bs58 = { workspace = true }
hex = { workspace = true }
oc-crypto = { workspace = true }
