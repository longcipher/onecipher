[package]
name = "oc-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "OneCipher BDD conformance test crate (cucumber-driven end-to-end scenarios)"

[dev-dependencies]
cucumber = { workspace = true }
ed25519-dalek = { workspace = true, features = ["hazmat", "rand_core"] }
getrandom = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
oc-core = { workspace = true }
oc-crypto = { workspace = true }
oc-keyagent = { workspace = true }
oc-policy = { workspace = true }
oc-proto = { workspace = true }
oc-session-key = { workspace = true }
oc-signer = { workspace = true }
oc-vault = { workspace = true, features = ["test-utils"] }
rand_core = "0.10"
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Test-only crate — no library, just the `conformance` test binary that
# drives the cucumber scenarios under tests/conformance/.
[[test]]
name = "conformance"
harness = false
path = "tests/conformance/main.rs"

[lints]
workspace = true
