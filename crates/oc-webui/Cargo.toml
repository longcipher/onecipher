[package]
name = "oc-webui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Web UI approval surface for OneCipher daemon"

[dependencies]
axum = { workspace = true, features = ["ws", "macros"] }
dashmap = { workspace = true }
hex = { workspace = true }
oc-core = { workspace = true }
oc-walletconnect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "time", "rt", "macros", "fs"] }
tower = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
webauthn-rs = { workspace = true, features = ["danger-allow-state-serialisation", "workaround-google-passkey-specific-issues"] }

[dev-dependencies]
hpx = { workspace = true, features = ["rustls-tls", "http1", "http2", "json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
