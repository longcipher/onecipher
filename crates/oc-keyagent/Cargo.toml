[package]
name = "oc-keyagent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Key-Agent main loop (sync std::os::unix::net + std::thread, NO tokio) for OneCipher"

[lib]
name = "oc_keyagent"
path = "src/lib.rs"

[dependencies]
# T11 scaffolding: prost (Message wire codec) + thiserror (errors).
# T13 (memory hardening): oc-crypto (HardenedBytes) + oc-vault (Vault::decrypt) + oc-signer (Mnemonic, HdDeriver).
# T14 (audit): serde + sha2 + ed25519-dalek + hex + jiff (chain hash + signatures).
# T15 (passkey): p256 + ed25519-dalek + rand (P-256/Ed25519 verify + OsRng).
# T16 (policy integration): oc-policy (evaluate_11_step + PolicyState + AlertSink).
ed25519-dalek = { workspace = true, features = ["hazmat", "rand_core"] }
hex = { workspace = true }
jiff = { workspace = true }
oc-core = { workspace = true, features = ["hardened"] }
oc-crypto = { workspace = true }
oc-policy = { workspace = true }
oc-signer = { workspace = true }
oc-vault = { workspace = true }
oc-wallet = { workspace = true, default-features = false }
p256 = { workspace = true, features = ["ecdsa"] }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# R56: NO tokio, NO reqwest, NO hyper, NO async-std, NO smol — even as dev-deps.
# tracing is a pure log facade (no I/O, no async runtime) — R56-safe.
# IPC wire types live in `src/proto.rs` (replaces the former `oc-proto` crate).

# T12 sandbox: libc for seccomp/prctl/capset (Linux) and
# sandbox_init/ptrace/setrlimit (macOS). Target-specific so the dep does not
# resolve on Windows, whose implementation uses raw `extern "system"` bindings
# to kernel32 (already linked by every Rust binary) rather than `windows-sys`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# T14 audit tests need direct access to ed25519-dalek + sha2 + hex + rand
# (test crate can only see dev-deps, not lib deps)
ed25519-dalek = { workspace = true, features = ["hazmat", "rand_core"] }
hex = { workspace = true }
oc-core = { workspace = true, features = ["hardened"] }
proptest = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
