[package]
name = "oc-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Wallet vault (filesystem 700/600, Keystore v3, .ocbk BackupContainer) for OneCipher"

[features]
# Exposes test-only helpers (e.g. `set_backoff_override`) to downstream
# test crates (such as `oc-conformance`) that live in separate crates and
# therefore do not have `cfg(test)` set for `oc-vault`.
test-utils = []

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
oc-core = { workspace = true }
oc-crypto = { workspace = true }
oc-signer = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
