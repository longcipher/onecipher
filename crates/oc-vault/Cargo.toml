[package]
name = "oc-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Wallet vault (filesystem 700/600, age-encrypted wallets, age backup bundles) for OneCipher"

[features]
# Test-only low age scrypt work factor for fast unit tests. NEVER enable in
# release: the `compile_error!` in `src/crypto/envelope.rs` fails the build if
# `fast-kdf` meets `not(debug_assertions)`.
fast-kdf = []

[dependencies]
age = { workspace = true }
base64 = { workspace = true }
bech32 = { workspace = true }
hex = { workspace = true }
oc-core = { workspace = true, features = ["hardened"] }
oc-crypto = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
