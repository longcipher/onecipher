# Cargo project-local configuration.
#
# This file is checked into the repo and applies to every cargo invocation
# inside the workspace. User-level settings (sccache / kache wrappers, etc.)
# belong in `~/.cargo/config.toml`, NOT here.

[build]
# Enable pipelined compilation (cargo 1.40+). Cargo passes the rmeta files
# to downstream crates before the upstream crate finishes codegen, so large
# dependency graphs compile faster.
pipelining = true

# Parallel jobs. Overridable via `--jobs` / `CARGO_BUILD_JOBS`.
# Default to the number of logical CPUs.
# jobs = 8

[net]
# Retry failed network fetches a few times before giving up.
retry = 3

# NOTE: The macOS Homebrew OpenSSL overrides that used to live in this
# `[env]` block were removed because cargo cannot gate `[env]` on the host OS
# (rust-lang/cargo#10273 is still open) — the variables were exported on every
# platform and broke Linux builds, where the `/opt/homebrew/...` paths do not
# exist. On Linux/CI openssl-sys resolves OpenSSL via pkg-config.
#
# macOS-only background: the final binary links BOTH BoringSSL (via hpx's
# boring-tls) AND OpenSSL (via webauthn-rs's openssl). Both emit `-lssl
# -lcrypto`, and the linker resolves `-lcrypto` to the FIRST matching library
# in `-L` order — so when openssl-sys links the bare `libssl`/`libcrypto`, it
# can resolve to BoringSSL's static `libcrypto.a` instead of Homebrew's, which
# lacks OpenSSL 3.2+ symbols (`_ERR_get_error_all`). Versioned library names
# (`libcrypto.3.dylib`) are unique to Homebrew's OpenSSL keg and sidestep the
# collision entirely. macOS developers should set these in
# `~/.cargo/config.toml` (machine-level) instead of this committed file:
#
# [env]
# OPENSSL_LIBS = { value = "crypto.3:ssl.3", relative = false, force = false }
# OPENSSL_LIB_DIR = { value = "/opt/homebrew/opt/openssl@3/lib", relative = false, force = false }
# OPENSSL_INCLUDE_DIR = { value = "/opt/homebrew/opt/openssl@3/include", relative = false, force = false }

[registries.crates-io]
# Use the sparse protocol (default in 1.68+) for faster index fetches.
protocol = "sparse"
