# cargo-audit configuration.
#
# This file is read by `cargo audit` (invoked by the conformance
# supply_chain.feature scenario and CI). It lets us record a *justified*
# decision to accept an advisory instead of failing the build, so the gate
# stays green without ever silently hiding a reachable vulnerability.
#
# The previous entry tolerated RUSTSEC-2026-0235 (rkyv in rust_decimal) which
# was only reachable via `rust_decimal` in the retired `oc-pay` crate. Both
# `oc-pay` and its `rust_decimal` dependency have been removed from the
# workspace, so the advisory is no longer present in the dependency graph and
# no ignore entry is required.
